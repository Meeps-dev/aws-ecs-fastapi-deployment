name: Terraform Plan

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-dev
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
  AWS_PAGER: ""

  TF_DIR: infrastructure/terraform/environments/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_owner: ${{ vars.TF_OWNER }}

  TF_VAR_github_owner: ${{ github.event.repository.owner.login }}
  TF_VAR_github_owner_id: ${{ github.event.repository.owner.id }}
  TF_VAR_github_repository: ${{ github.event.repository.name }}
  TF_VAR_github_repository_id: ${{ github.event.repository.id }}
  TF_VAR_github_branch: main

jobs:
  plan:
    name: Remote-state plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Initialize remote state
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Resolve the Terraform-owned bootstrap image digest
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN="$(
            terraform -chdir="$TF_DIR" \
              output -raw ecs_task_definition_arn
          )"

          BOOTSTRAP_IMAGE="$(
            aws ecs describe-task-definition \
              --task-definition "$TASK_DEFINITION_ARN" \
              --query "taskDefinition.containerDefinitions[?name=='fastapi'].image | [0]" \
              --output text
          )"

          BOOTSTRAP_DIGEST="${BOOTSTRAP_IMAGE##*@}"

          if ! printf '%s\n' "$BOOTSTRAP_DIGEST" \
            | grep -Eq '^sha256:[0-9a-f]{64}$'; then

            echo "Could not resolve the Terraform-owned bootstrap image digest."
            exit 1
          fi

          echo "TF_VAR_ecs_image_digest=$BOOTSTRAP_DIGEST" \
            >> "$GITHUB_ENV"

      - name: Run Terraform plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform -chdir="$TF_DIR" plan \
            -input=false \
            -lock-timeout=3m \
            -no-color \
            -detailed-exitcode \
            | tee "$RUNNER_TEMP/terraform-plan.txt"

          EXIT_CODE="${PIPESTATUS[0]}"

          set -e

          case "$EXIT_CODE" in
            0)
              RESULT="No infrastructure changes."
              ;;
            2)
              RESULT="Terraform detected infrastructure changes. No apply was performed."
              ;;
            *)
              echo "Terraform plan failed."
              exit "$EXIT_CODE"
              ;;
          esac

          {
            echo "## Terraform Plan"
            echo
            echo "$RESULT"
            echo
            grep -E '^(Plan:|No changes\.)' \
              "$RUNNER_TEMP/terraform-plan.txt" \
              || true
          } >> "$GITHUB_STEP_SUMMARY"
