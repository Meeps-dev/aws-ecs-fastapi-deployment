[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Added Ruff and pytest configuration , checks whether files are correctly formatted without modifying them